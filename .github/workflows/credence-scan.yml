name: Credence Pipeline — Scan MCP Server

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      scan_id:
        description: 'Scan ID (commit SHA prefix from scan-results/)'
        required: true
        type: string
      action:
        description: 'Action to take'
        required: true
        type: choice
        options:
          - publish

jobs:
  # ── JOB 1: ACKNOWLEDGE ─────────────────────────
  # Fires on issue open. Validates format and tells the submitter
  # that a maintainer will review before scanning begins.
  acknowledge:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Acknowledge submission
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const repoMatch = body.match(/\*\*Repository:\*\*\s*(https?:\/\/[^\s\n]+)/);

            if (!repoMatch) {
              // Not a scan submission — ignore
              core.info('Issue does not match submission format, skipping');
              return;
            }

            const repoUrl = repoMatch[1].replace(/\/$/, '');
            const pathMatch = body.match(/\*\*Server path:\*\*\s*(.+)/);
            const serverPath = pathMatch ? pathMatch[1].trim() : '';
            const pathNote = serverPath ? `\nServer path: \`${serverPath}\`` : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Submission received**\n\nRepository: \`${repoUrl}\`${pathNote}\n\nA Credence maintainer will review this submission. Scanning begins when the \`submission\` label is applied.\n\n_This is an automated acknowledgment._`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['pending-review']
            });

  # ── JOB 2: SCAN ────────────────────────────────
  # Fires only when a collaborator adds the 'submission' label.
  # This is the gate — no label, no scan.
  scan:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'submission'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      # Gate: verify the person who added the label has write access
      - name: Verify label was added by collaborator
        uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender.login;
            const { data: permLevel } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: sender
            });
            const allowed = ['admin', 'write'];
            if (!allowed.includes(permLevel.permission)) {
              core.setFailed(`Scan blocked: ${sender} has '${permLevel.permission}' access, needs 'write' or 'admin'`);
            }
            core.info(`Label added by ${sender} (${permLevel.permission}) — scan authorized`);

      - name: Checkout Credence registry
        uses: actions/checkout@v4

      - name: Parse submission
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            const repoMatch = body.match(/\*\*Repository:\*\*\s*(https?:\/\/[^\s\n]+)/);
            const commitMatch = body.match(/\*\*Commit SHA:\*\*\s*`?([a-f0-9]+)`?/i);
            const nameMatch = body.match(/\*\*Server name:\*\*\s*(.+)/);
            const pathMatch = body.match(/\*\*Server path:\*\*\s*(.+)/);

            if (!repoMatch) {
              core.setFailed('Could not parse repository URL from issue body');
              return;
            }

            const repoUrl = repoMatch[1].replace(/\/$/, '');
            const commitSha = commitMatch ? commitMatch[1] : '';
            const serverName = nameMatch ? nameMatch[1].trim() : 'unknown';
            const serverPath = pathMatch ? pathMatch[1].trim().replace(/`/g, '').replace(/^\/+|\/+$/g, '') : '';

            // Detect host type and extract owner/repo
            const ghMatch = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
            const glMatch = repoUrl.match(/gitlab\.com\/([^\/]+)\/([^\/]+)/);
            const bbMatch = repoUrl.match(/bitbucket\.org\/([^\/]+)\/([^\/]+)/);

            let repoOwner = '', repoName = '', hostType = 'unknown';
            if (ghMatch) {
              repoOwner = ghMatch[1]; repoName = ghMatch[2]; hostType = 'github';
            } else if (glMatch) {
              repoOwner = glMatch[1]; repoName = glMatch[2]; hostType = 'gitlab';
            } else if (bbMatch) {
              repoOwner = bbMatch[1]; repoName = bbMatch[2]; hostType = 'bitbucket';
            } else if (repoUrl.match(/^https?:\/\/.+\/.+\/.+/)) {
              // Generic git URL — extract last two path segments as owner/repo
              const parts = repoUrl.replace(/\.git$/, '').split('/');
              repoName = parts.pop(); repoOwner = parts.pop();
              hostType = 'other-git';
            }

            core.setOutput('repo_url', repoUrl);
            core.setOutput('commit_sha', commitSha);
            core.setOutput('server_name', serverName);
            core.setOutput('server_path', serverPath);
            core.setOutput('repo_owner', repoOwner);
            core.setOutput('repo_name', repoName);
            core.setOutput('host_type', hostType);
            core.info(`Host type: ${hostType} | Owner: ${repoOwner} | Repo: ${repoName}`);

      - name: Verify submitter identity
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const submitter = context.payload.issue.user.login;
            const targetOwner = '${{ steps.parse.outputs.repo_owner }}';
            const targetRepo = '${{ steps.parse.outputs.repo_name }}';
            const hostType = '${{ steps.parse.outputs.host_type }}';
            let verified = false;
            let verifyReason = '';

            if (hostType !== 'github') {
              // Can't verify submitter against non-GitHub repos via GitHub API
              verifyReason = `Non-GitHub host (${hostType}) — submitter verification not available`;
            } else {
              // Check 1: Is submitter the repo owner?
              if (submitter.toLowerCase() === targetOwner.toLowerCase()) {
                verified = true;
                verifyReason = 'Submitter is repo owner';
              }

              // Check 2: Is submitter a collaborator?
              if (!verified) {
                try {
                  const { status } = await github.rest.repos.checkCollaborator({
                    owner: targetOwner,
                    repo: targetRepo,
                    username: submitter
                  });
                  if (status === 204) {
                    verified = true;
                    verifyReason = 'Submitter is repo collaborator';
                  }
                } catch (e) {
                  // 404 = not a collaborator, 403 = private repo or no access
                }
              }

              // Check 3: Is submitter a contributor (has commits)?
              if (!verified) {
                try {
                  const { data: contributors } = await github.rest.repos.listContributors({
                    owner: targetOwner,
                    repo: targetRepo,
                    per_page: 100
                  });
                  if (contributors.some(c => c.login.toLowerCase() === submitter.toLowerCase())) {
                    verified = true;
                    verifyReason = 'Submitter is listed contributor';
                  }
                } catch (e) {
                  // API error — treat as unverified
                }
              }

              if (!verified) {
                verifyReason = 'Third-party submission — submitter is not owner, collaborator, or contributor';
              }
            }

            core.setOutput('verified', verified.toString());
            core.setOutput('reason', verifyReason);
            core.info(`Submitter: ${submitter} | Verified: ${verified} | ${verifyReason}`);

            const serverPath = '${{ steps.parse.outputs.server_path }}';
            const pathLine = serverPath ? `\nServer path: \`${serverPath}\`` : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Scan started**\n\nAnalyzing: \`${{ steps.parse.outputs.repo_url }}\`${pathLine}\nCommit: \`${{ steps.parse.outputs.commit_sha || 'latest' }}\`\n\nStages: Collect → Scan → Score → Attest\n\n_Results will be posted here when complete._`
            });

      - name: Clone target server
        id: clone
        continue-on-error: true
        run: |
          if ! git clone ${{ steps.parse.outputs.repo_url }} /tmp/target-server 2>/tmp/clone-error.txt; then
            echo "clone_failed=true" >> $GITHUB_OUTPUT
            echo "Clone failed:"
            cat /tmp/clone-error.txt
            exit 0
          fi
          echo "clone_failed=false" >> $GITHUB_OUTPUT

          cd /tmp/target-server
          if [ -n "${{ steps.parse.outputs.commit_sha }}" ]; then
            git checkout ${{ steps.parse.outputs.commit_sha }}
          fi
          echo "TARGET_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

          # Set SCAN_DIR: subdirectory if specified, otherwise full repo
          SERVER_PATH="${{ steps.parse.outputs.server_path }}"
          if [ -n "$SERVER_PATH" ]; then
            SCAN_DIR="/tmp/target-server/$SERVER_PATH"
            if [ ! -d "$SCAN_DIR" ]; then
              echo "Error: server path '$SERVER_PATH' does not exist in this repo"
              ls -la /tmp/target-server/
              echo "clone_failed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            SCAN_DIR="/tmp/target-server"
          fi
          echo "SCAN_DIR=$SCAN_DIR" >> $GITHUB_ENV
          echo "Scan directory: $SCAN_DIR"

      - name: Report clone failure
        if: steps.clone.outputs.clone_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Scan failed — unable to clone repository**\n\n` +
                `Repository: \`${{ steps.parse.outputs.repo_url }}\`\n\n` +
                `Possible reasons:\n` +
                `- The repository is private or requires authentication\n` +
                `- The URL is not a valid git repository\n` +
                `- The repository has been deleted or moved\n\n` +
                `Credence can only scan publicly accessible git repositories. ` +
                `If this is a public repo that should be accessible, please verify the URL and resubmit.`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: ['scan-failed']
            });
            core.setFailed('Clone failed — cannot proceed with scan');

      # ── STAGE 1: COLLECT ──────────────────────────────

      - name: Generate source hash (Merkle tree SHA-256)
        if: steps.clone.outputs.clone_failed != 'true'
        run: |
          cd $SCAN_DIR
          # Deterministic hash: sort files, hash each, hash the hashes
          find . -type f -not -path './.git/*' | sort | xargs sha256sum | sha256sum | awk '{print $1}' > /tmp/source_hash.txt
          echo "SOURCE_HASH=$(cat /tmp/source_hash.txt)" >> $GITHUB_ENV
          echo "Source hash: $(cat /tmp/source_hash.txt)"

      - name: Extract author identity
        if: steps.clone.outputs.clone_failed != 'true'
        id: identity
        run: |
          cd $SCAN_DIR
          IDENTITY_JSON="{}"

          # Package.json author
          if [ -f "package.json" ]; then
            PKG_AUTHOR=$(jq -r '.author // .contributors[0] // "unknown"' package.json 2>/dev/null || echo "unknown")
            IDENTITY_JSON=$(echo "$IDENTITY_JSON" | jq --arg a "$PKG_AUTHOR" '. + {package_author: $a}')
          fi

          # Package.json name (canonical package name)
          if [ -f "package.json" ]; then
            PKG_NAME=$(jq -r '.name // ""' package.json 2>/dev/null || echo "")
            IDENTITY_JSON=$(echo "$IDENTITY_JSON" | jq --arg n "$PKG_NAME" '. + {package_name: $n}')
          fi

          # pyproject.toml author
          if [ -f "pyproject.toml" ]; then
            PY_AUTHOR=$(grep -E "^authors?\s*=" pyproject.toml | head -1 | sed 's/.*=\s*//' || echo "unknown")
            IDENTITY_JSON=$(echo "$IDENTITY_JSON" | jq --arg a "$PY_AUTHOR" '. + {pyproject_author: $a}')
          fi

          # pyproject.toml name (canonical package name)
          if [ -f "pyproject.toml" ]; then
            PY_NAME=$(python3 -c "
          import tomllib
          try:
              with open('pyproject.toml', 'rb') as f:
                  data = tomllib.load(f)
              print(data.get('project', {}).get('name', ''))
          except Exception:
              print('')
          " 2>/dev/null || echo "")
            IDENTITY_JSON=$(echo "$IDENTITY_JSON" | jq --arg n "$PY_NAME" '. + {pyproject_name: $n}')
          fi

          # Git remote owner
          REMOTE_URL=$(git remote get-url origin 2>/dev/null || echo "")
          IDENTITY_JSON=$(echo "$IDENTITY_JSON" | jq --arg r "$REMOTE_URL" '. + {remote_url: $r}')

          # Repo owner from parsed URL
          IDENTITY_JSON=$(echo "$IDENTITY_JSON" | jq --arg o "${{ steps.parse.outputs.repo_owner }}" '. + {repo_owner: $o}')

          echo "$IDENTITY_JSON" > /tmp/identity.json
          cat /tmp/identity.json

      - name: Detect lockfiles
        if: steps.clone.outputs.clone_failed != 'true'
        id: lockfile
        run: |
          LOCKFILE_FOUND=""
          LOCKFILE_HASH=""

          # Check scan directory first, then repo root (monorepo support)
          for SEARCH_DIR in "$SCAN_DIR" "/tmp/target-server"; do
            for LF in package-lock.json yarn.lock pnpm-lock.yaml Pipfile.lock poetry.lock Cargo.lock go.sum; do
              if [ -f "$SEARCH_DIR/$LF" ]; then
                LOCKFILE_FOUND="$LF"
                LOCKFILE_HASH=$(sha256sum "$SEARCH_DIR/$LF" | awk '{print $1}')
                break 2
              fi
            done
          done

          if [ -z "$LOCKFILE_FOUND" ]; then
            echo "lockfile_found=false" >> $GITHUB_OUTPUT
            echo "lockfile_name=none" >> $GITHUB_OUTPUT
            echo "lockfile_hash=none" >> $GITHUB_OUTPUT
            echo "No lockfile detected"
          else
            echo "lockfile_found=true" >> $GITHUB_OUTPUT
            echo "lockfile_name=$LOCKFILE_FOUND" >> $GITHUB_OUTPUT
            echo "lockfile_hash=$LOCKFILE_HASH" >> $GITHUB_OUTPUT
            echo "Lockfile: $LOCKFILE_FOUND ($LOCKFILE_HASH)"
          fi

      - name: Check fork status and provenance
        if: steps.clone.outputs.clone_failed != 'true'
        id: provenance
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = '${{ steps.parse.outputs.repo_owner }}';
            const repo = '${{ steps.parse.outputs.repo_name }}';
            const hostType = '${{ steps.parse.outputs.host_type }}';
            const flags = [];

            // Non-GitHub hosts: can't verify provenance via GitHub API
            if (hostType !== 'github') {
              flags.push('NON_GITHUB_HOST');
              if ('${{ steps.lockfile.outputs.lockfile_found }}' === 'false') {
                flags.push('NO_LOCKFILE');
              }
              core.setOutput('flags', JSON.stringify(flags));
              core.setOutput('is_fork', 'false');
              core.setOutput('lockfile_hash', '${{ steps.lockfile.outputs.lockfile_hash }}');
              core.setOutput('lockfile_name', '${{ steps.lockfile.outputs.lockfile_name }}');
              core.info(`Non-GitHub host (${hostType}) — skipping GitHub provenance checks`);
              return;
            }

            try {
              const { data: repoData } = await github.rest.repos.get({ owner, repo });

              if (repoData.fork) {
                flags.push('IS_FORK');

                // Check if original author is in contributors
                if (repoData.parent) {
                  const parentOwner = repoData.parent.owner.login;
                  try {
                    const { data: contributors } = await github.rest.repos.listContributors({ owner, repo, per_page: 100 });
                    const contributorLogins = contributors.map(c => c.login);

                    if (!contributorLogins.includes(parentOwner)) {
                      flags.push('ORIGINAL_AUTHOR_EXCLUDED');
                    }
                  } catch (e) {
                    flags.push('CONTRIBUTORS_UNAVAILABLE');
                  }
                }
              }

              // Account age check (tiered flags per scoring methodology)
              const { data: ownerData } = await github.rest.users.getByUsername({ username: owner });
              const accountAge = (Date.now() - new Date(ownerData.created_at)) / (1000 * 60 * 60 * 24);
              if (accountAge < 30) {
                flags.push('ACCOUNT_YOUNG_LT_30_DAYS');
              } else if (accountAge < 90) {
                flags.push('ACCOUNT_YOUNG_LT_90_DAYS');
              } else if (accountAge < 180) {
                flags.push('ACCOUNT_YOUNG_LT_180_DAYS');
              }

              // Check if repo owner differs from claimed author in package metadata
              // Only meaningful for forks — for non-forks, the owner created the repo
              // and may simply use a different org name than their package author field
              if (repoData.fork) {
                try {
                  const identity = JSON.parse(fs.readFileSync('/tmp/identity.json', 'utf8'));
                  const claimedAuthor = (identity.package_author || identity.pyproject_author || '').toLowerCase();
                  const repoOwner = owner.toLowerCase();

                  if (claimedAuthor && claimedAuthor !== 'unknown' && !claimedAuthor.includes(repoOwner)) {
                    flags.push('REPO_OWNER_DIFFERS_FROM_CLAIMED_AUTHOR');
                  }
                } catch (e) {
                  // identity.json not available — skip this check
                }
              }

              // Lockfile flag from previous step
              if ('${{ steps.lockfile.outputs.lockfile_found }}' === 'false') {
                flags.push('NO_LOCKFILE');
              }

              // Coordinated fork network detection
              // Check if the repo owner has multiple forks from the same parent source
              try {
                const { data: ownerRepos } = await github.rest.repos.listForUser({
                  username: owner, per_page: 100, type: 'owner'
                });
                const forkSources = {};
                for (const r of ownerRepos) {
                  if (r.fork && r.parent) {
                    const src = r.parent.full_name;
                    forkSources[src] = (forkSources[src] || 0) + 1;
                  }
                }
                // Also check: does this owner's repos get forked by the same small set of accounts?
                // Fetch forkers of the submitted repo
                try {
                  const { data: forks } = await github.rest.repos.listForks({
                    owner, repo, per_page: 100
                  });
                  if (forks.length >= 3) {
                    // Check if forkers fork each other's repos (ring pattern)
                    const forkerLogins = new Set(forks.map(f => f.owner.login));
                    let crossForkCount = 0;
                    // Sample up to 5 forkers to avoid rate limits
                    for (const forker of [...forkerLogins].slice(0, 5)) {
                      try {
                        const { data: forkerRepos } = await github.rest.repos.listForUser({
                          username: forker, per_page: 30, type: 'owner'
                        });
                        for (const fr of forkerRepos) {
                          // Check if this fork's SOURCE repo is owned by another forker
                          if (fr.fork && fr.parent && forkerLogins.has(fr.parent.owner?.login)
                              && fr.parent.owner?.login !== forker) {
                            crossForkCount++;
                          }
                        }
                      } catch (e) { /* rate limit or private — skip */ }
                    }
                    // 3+ cross-forks among the forker set indicates coordination
                    if (crossForkCount >= 3) {
                      flags.push('COORDINATED_FORK_NETWORK');
                    }
                  }
                } catch (e) { /* fork listing failed — skip */ }
              } catch (e) { /* owner repos listing failed — skip */ }

              core.setOutput('flags', JSON.stringify(flags));
              core.setOutput('is_fork', repoData.fork ? 'true' : 'false');
              core.setOutput('lockfile_hash', '${{ steps.lockfile.outputs.lockfile_hash }}');
              core.setOutput('lockfile_name', '${{ steps.lockfile.outputs.lockfile_name }}');

            } catch (e) {
              core.error(`Provenance check failed: ${e.message}`);
              core.setOutput('flags', JSON.stringify(['REPO_API_ERROR']));
              core.setOutput('is_fork', 'false');
              core.setOutput('lockfile_hash', '${{ steps.lockfile.outputs.lockfile_hash }}');
              core.setOutput('lockfile_name', '${{ steps.lockfile.outputs.lockfile_name }}');
            }

      - name: Generate SBOM
        if: steps.clone.outputs.clone_failed != 'true' && env.SCAN_DIR != ''
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.SCAN_DIR }}
          output-file: /tmp/sbom.spdx.json
          format: spdx-json

      # ── STAGE 2: SCAN ─────────────────────────────────

      - name: Install scan tools
        if: steps.clone.outputs.clone_failed != 'true'
        env:
          DELIBERATION_PAT: ${{ secrets.DELIBERATION_PAT }}
        run: |
          pip install semgrep bandit cryptography --break-system-packages -q
          pip install ./mcp-server --break-system-packages -q
          if [ -n "$DELIBERATION_PAT" ]; then
            pip install --no-cache-dir git+https://${DELIBERATION_PAT}@github.com/pestafford/deliberation-mcp.git --break-system-packages -q
          else
            echo "DELIBERATION_PAT not set — deliberation-mcp will not be installed"
          fi
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          curl -sfL https://raw.githubusercontent.com/gitleaks/gitleaks/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Semgrep SAST
        if: steps.clone.outputs.clone_failed != 'true'
        continue-on-error: true
        run: |
          cd $SCAN_DIR
          semgrep scan --config auto --json --output /tmp/semgrep-results.json . 2>/dev/null || echo '{"results":[]}' > /tmp/semgrep-results.json

      - name: Run Bandit (Python)
        if: steps.clone.outputs.clone_failed != 'true'
        continue-on-error: true
        run: |
          cd $SCAN_DIR
          bandit -r . -f json -o /tmp/bandit-results.json 2>/dev/null || echo '{"results":[]}' > /tmp/bandit-results.json

      - name: Run Trivy (CVE scan)
        if: steps.clone.outputs.clone_failed != 'true'
        continue-on-error: true
        run: |
          trivy fs --format json --output /tmp/trivy-results.json $SCAN_DIR 2>/dev/null || echo '{"Results":[]}' > /tmp/trivy-results.json

      - name: Run GitLeaks (secrets)
        if: steps.clone.outputs.clone_failed != 'true'
        continue-on-error: true
        run: |
          cd $SCAN_DIR
          gitleaks detect --source . --report-format json --report-path /tmp/gitleaks-results.json 2>/dev/null || echo '[]' > /tmp/gitleaks-results.json

      # ── STAGE 3: MCP TOOL ANALYSIS ────────────────────

      - name: Analyze MCP tool definitions
        if: steps.clone.outputs.clone_failed != 'true'
        id: mcp_analysis
        run: |
          cd $SCAN_DIR

          # Find tool definitions - look for common MCP patterns
          echo "Scanning for MCP tool definitions..."
          TOOL_FILES=$(grep -rl "tool\|Tool\|ListToolsResult\|server.tool" --include="*.py" --include="*.ts" --include="*.js" --include="*.json" . 2>/dev/null | head -20)

          TOOL_REPORT='{"tool_files_found": 0, "descriptions_analyzed": 0, "warnings": []}'

          if [ -n "$TOOL_FILES" ]; then
            FILE_COUNT=$(echo "$TOOL_FILES" | wc -l)
            TOOL_REPORT=$(echo "$TOOL_REPORT" | jq --arg c "$FILE_COUNT" '.tool_files_found = ($c | tonumber)')

            # Check for suspicious patterns in tool descriptions
            SUSPICIOUS=$(grep -rn "ignore previous\|system prompt\|<script\|eval(\|exec(\|__import__\|subprocess\|os.system" $TOOL_FILES 2>/dev/null || true)
            if [ -n "$SUSPICIOUS" ]; then
              TOOL_REPORT=$(echo "$TOOL_REPORT" | jq '.warnings += ["SUSPICIOUS_PATTERNS_IN_TOOL_FILES"]')
            fi

            # Check for dynamic description loading
            DYNAMIC=$(grep -rn "fetch\|requests.get\|urllib\|http.get\|axios" $TOOL_FILES 2>/dev/null | grep -i "description\|tool" || true)
            if [ -n "$DYNAMIC" ]; then
              TOOL_REPORT=$(echo "$TOOL_REPORT" | jq '.warnings += ["DYNAMIC_DESCRIPTION_LOADING"]')
            fi
          fi

          echo "$TOOL_REPORT" > /tmp/mcp-tool-analysis.json
          cat /tmp/mcp-tool-analysis.json

      # ── STAGE 4: COMPILE RESULTS ──────────────────────

      - name: Compile scan summary
        if: steps.clone.outputs.clone_failed != 'true'
        id: summary
        run: |
          SEMGREP_COUNT=$(jq '.results | length' /tmp/semgrep-results.json 2>/dev/null || echo 0)
          BANDIT_COUNT=$(jq '.results | length' /tmp/bandit-results.json 2>/dev/null || echo 0)
          TRIVY_VULNS=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' /tmp/trivy-results.json 2>/dev/null || echo 0)
          GITLEAKS_COUNT=$(jq 'length' /tmp/gitleaks-results.json 2>/dev/null || echo 0)
          MCP_WARNINGS=$(jq '.warnings | length' /tmp/mcp-tool-analysis.json 2>/dev/null || echo 0)
          MCP_CRITICAL=$(jq '.critical_count // 0' /tmp/mcp-tool-analysis.json 2>/dev/null || echo 0)
          PROV_FLAGS='${{ steps.provenance.outputs.flags }}'
          IS_FORK='${{ steps.provenance.outputs.is_fork }}'
          if [ "$IS_FORK" = "true" ]; then
            IS_FORK_JSON="true"
          else
            IS_FORK_JSON="false"
          fi

          # Extract canonical name from identity metadata
          CANONICAL_NAME=""
          if [ -f /tmp/identity.json ]; then
            CANONICAL_NAME=$(jq -r '.package_name // .pyproject_name // ""' /tmp/identity.json)
          fi

          # Extract maintainer verification status
          MAINTAINER_VERIFIED="${{ steps.verify.outputs.verified }}"
          if [ "$MAINTAINER_VERIFIED" = "true" ]; then
            MV_JSON="true"
          else
            MV_JSON="false"
          fi
          VERIFY_REASON="${{ steps.verify.outputs.reason }}"

          cat > /tmp/scan-summary.json <<EOF
          {
            "server_name": "${{ steps.parse.outputs.server_name }}",
            "canonical_name": "$CANONICAL_NAME",
            "server_path": "${{ steps.parse.outputs.server_path }}",
            "maintainer_verified": $MV_JSON,
            "verify_reason": "$VERIFY_REASON",
            "repo_url": "${{ steps.parse.outputs.repo_url }}",
            "commit_sha": "${{ env.TARGET_COMMIT }}",
            "source_hash": "${{ env.SOURCE_HASH }}",
            "source_hash_method": "merkle-tree-sha256",
            "is_fork": $IS_FORK_JSON,
            "provenance_flags": $PROV_FLAGS,
            "lockfile_name": "${{ steps.provenance.outputs.lockfile_name }}",
            "lockfile_hash": "${{ steps.provenance.outputs.lockfile_hash }}",
            "scan_results": {
              "semgrep_findings": $SEMGREP_COUNT,
              "bandit_findings": $BANDIT_COUNT,
              "trivy_vulnerabilities": $TRIVY_VULNS,
              "gitleaks_secrets": $GITLEAKS_COUNT,
              "mcp_tool_warnings": $MCP_WARNINGS,
              "mcp_tool_critical": $MCP_CRITICAL
            },
            "scan_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "pipeline_version": "0.2.0",
            "thinktank_verdict": "PENDING",
            "trust_score": null
          }
          EOF

          cat /tmp/scan-summary.json

          # Set outputs for the issue comment
          echo "semgrep=$SEMGREP_COUNT" >> $GITHUB_OUTPUT
          echo "bandit=$BANDIT_COUNT" >> $GITHUB_OUTPUT
          echo "trivy=$TRIVY_VULNS" >> $GITHUB_OUTPUT
          echo "gitleaks=$GITLEAKS_COUNT" >> $GITHUB_OUTPUT

      # ── STAGE 4a: NORMALIZE ──────────────────────────

      - name: Normalize scanner outputs
        if: steps.clone.outputs.clone_failed != 'true'
        run: |
          # Collect all scanner results into /tmp/ for the normalizer.
          # The normalizer looks for known filenames in a directory.
          python3 -m credence_mcp.report_normalizer /tmp/ /tmp/evidence.json

      # ── STAGE 4b: TRUST SCORE ────────────────────────

      - name: Compute trust score
        if: steps.clone.outputs.clone_failed != 'true'
        id: score
        run: |
          python3 -m credence_mcp.trust_score /tmp/scan-summary.json /tmp/evidence.json

          # Extract verdict for disclosure gating
          VERDICT=$(jq -r '.thinktank_verdict' /tmp/scan-summary.json)
          TRUST_SCORE=$(jq -r '.trust_score' /tmp/scan-summary.json)
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
          echo "trust_score=$TRUST_SCORE" >> $GITHUB_OUTPUT

          # FLAGGED or REJECTED → responsible disclosure window
          if echo "$VERDICT" | grep -qE "FLAGGED|REJECTED"; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Disclosure hold: $VERDICT ($TRUST_SCORE/100) — results will not be published"
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      # ── STAGE 4c: DELIBERATION ────────────────────────

      - name: Run adversarial deliberation
        if: steps.clone.outputs.clone_failed != 'true'
        id: deliberation
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Inherit preliminary publish decision (ensures downstream has a value even if we error)
          echo "publish=${{ steps.score.outputs.publish }}" >> $GITHUB_OUTPUT

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping deliberation, keeping preliminary score"
          elif ! command -v deliberation-mcp &>/dev/null; then
            echo "deliberation-mcp not installed — skipping deliberation, keeping preliminary score"
          else
            # Clear any stale deliberation sessions from previous runs
            rm -rf .deliberations/ /tmp/deliberation-transcript/

            python3 -m credence_mcp.deliberation_adapter run /tmp/ /tmp/scan-summary.json \
              --repo /tmp/target-server \
              --timeout 300 \
              --server-cmd "deliberation-mcp"

            # Copy deliberation artifacts to /tmp for reliable artifact upload
            cp -r .deliberations/ /tmp/deliberation-transcript/ 2>/dev/null || true

            # Re-extract verdict after deliberation may have updated it
            VERDICT=$(jq -r '.thinktank_verdict' /tmp/scan-summary.json)
            TRUST_SCORE=$(jq -r '.trust_score' /tmp/scan-summary.json)
            echo "Post-deliberation: $VERDICT ($TRUST_SCORE/100)"

            # Re-check disclosure gating with final verdict
            if echo "$VERDICT" | grep -qE "FLAGGED|REJECTED"; then
              echo "publish=false" >> $GITHUB_OUTPUT
              echo "Disclosure hold after deliberation: $VERDICT"
            fi
          fi

      - name: Annotate disclosure hold
        if: steps.clone.outputs.clone_failed != 'true' && steps.deliberation.outputs.publish == 'false'
        run: |
          SUMMARY=$(cat /tmp/scan-summary.json)
          SCORE=$(echo "$SUMMARY" | jq -r '.trust_score')
          VERDICT=$(echo "$SUMMARY" | jq -r '.thinktank_verdict')
          SERVER="${{ steps.parse.outputs.server_name }}"
          REPO="${{ steps.parse.outputs.repo_url }}"
          DIMS=$(echo "$SUMMARY" | jq -r '.trust_dimensions | "Security: \(.security), Provenance: \(.provenance), Behavioral: \(.behavioral)"')
          SEMGREP=$(echo "$SUMMARY" | jq -r '.scan_results.semgrep_findings')
          BANDIT=$(echo "$SUMMARY" | jq -r '.scan_results.bandit_findings')
          TRIVY=$(echo "$SUMMARY" | jq -r '.scan_results.trivy_vulnerabilities')
          GITLEAKS=$(echo "$SUMMARY" | jq -r '.scan_results.gitleaks_secrets')
          MCP_WARN=$(echo "$SUMMARY" | jq -r '.scan_results.mcp_tool_warnings')
          FLAGS=$(echo "$SUMMARY" | jq -r '.provenance_flags | join(", ")')

          cat >> $GITHUB_STEP_SUMMARY <<MDEOF
          ## Disclosure Hold — Manual Review Required

          | Field | Value |
          |-------|-------|
          | Server | ${SERVER} |
          | Repository | ${REPO} |
          | Commit | \`${{ env.TARGET_COMMIT }}\` |
          | Score | **${SCORE}/100** |
          | Verdict | **${VERDICT}** |
          | Dimensions | ${DIMS} |
          | Semgrep | ${SEMGREP} |
          | Bandit | ${BANDIT} |
          | Trivy CVEs | ${TRIVY} |
          | Gitleaks | ${GITLEAKS} |
          | MCP warnings | ${MCP_WARN} |
          | Provenance flags | ${FLAGS:-none} |

          Detailed findings available in the workflow artifacts (90-day retention).

          To publish after disclosure: use the **Publish held scan** workflow dispatch with scan ID \`$(echo "${{ env.TARGET_COMMIT }}" | cut -c1-8)\`.
          MDEOF

      # ── STAGE 4d: SIGN + REPORTS + REGISTRY ──────────

      - name: Generate report and badge
        if: steps.clone.outputs.clone_failed != 'true'
        run: |
          python3 -m credence_mcp.report_generator /tmp/scan-summary.json /tmp/evidence.json /tmp/report.html
          python3 -m credence_mcp.badge_generator --from-summary /tmp/scan-summary.json /tmp/badge.svg

      - name: Update registry and sign attestation
        if: steps.clone.outputs.clone_failed != 'true' && steps.deliberation.outputs.publish == 'true'
        env:
          CREDENCE_SIGNING_KEY: ${{ secrets.CREDENCE_SIGNING_KEY }}
        run: |
          if [ -n "$CREDENCE_SIGNING_KEY" ]; then
            python3 -m credence_mcp.registry_update /tmp/scan-summary.json registry/ --key-env CREDENCE_SIGNING_KEY
          else
            echo "Warning: CREDENCE_SIGNING_KEY not set — attestation will be unsigned"
            python3 -m credence_mcp.registry_update /tmp/scan-summary.json registry/
          fi

      # ── STAGE 5: STORE RESULTS ────────────────────────

      - name: Store scan results
        if: steps.clone.outputs.clone_failed != 'true'
        run: |
          SCAN_ID=$(echo "${{ env.TARGET_COMMIT }}" | cut -c1-8)
          RESULTS_DIR="scan-results/${SCAN_ID}"
          mkdir -p "$RESULTS_DIR"

          # Public: redacted summary (scores/verdict/provenance only) + badge.
          # Finding counts and scoring breakdowns stay in ephemeral artifacts.
          jq 'del(.scan_results, .scoring_breakdowns)' /tmp/scan-summary.json > "$RESULTS_DIR/summary.json"
          cp /tmp/badge.svg "$RESULTS_DIR/badge.svg" 2>/dev/null || true

          echo "SCAN_ID=$SCAN_ID" >> $GITHUB_ENV
          echo "RESULTS_DIR=$RESULTS_DIR" >> $GITHUB_ENV

      - name: Upload detailed findings (ephemeral — for remediation / audit only)
        if: steps.clone.outputs.clone_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-findings-${{ env.TARGET_COMMIT }}
          path: |
            /tmp/semgrep-results.json
            /tmp/bandit-results.json
            /tmp/trivy-results.json
            /tmp/gitleaks-results.json
            /tmp/mcp-tool-analysis.json
            /tmp/evidence.json
            /tmp/sbom.spdx.json
            /tmp/report.html
          retention-days: 90

      - name: Upload deliberation transcript (ephemeral — audit trail)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deliberation-${{ env.TARGET_COMMIT }}
          path: /tmp/deliberation-transcript/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit results to repo
        if: steps.clone.outputs.clone_failed != 'true'
        run: |
          git config user.name "credence-bot"
          git config user.email "credence-bot@users.noreply.github.com"
          git add scan-results/
          if [ "${{ steps.deliberation.outputs.publish }}" = "true" ]; then
            git add registry/ registry.json
          fi
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "scan: ${{ steps.parse.outputs.server_name }} @ ${{ env.TARGET_COMMIT }}"
          git push

      # ── POST RESULTS TO ISSUE ─────────────────────────

      - name: Post results to issue
        if: steps.clone.outputs.clone_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = require('/tmp/scan-summary.json');
            const flags = summary.provenance_flags || [];
            const verified = '${{ steps.verify.outputs.verified }}' === 'true';
            const publish = '${{ steps.deliberation.outputs.publish }}' === 'true';

            const trustScore = summary.trust_score;
            const verdict = summary.thinktank_verdict || 'PENDING';
            const dims = summary.trust_dimensions || {};
            const serverPath = summary.server_path || '';
            const pathLine = serverPath ? `\n**Server path:** \`${serverPath}\`` : '';

            let body;

            if (!publish) {
              // ── DISCLOSURE HOLD ──
              // Score is FLAGGED or REJECTED. Do not publish any results.
              // The maintainer will be contacted privately.
              body = `## Credence Scan Complete

            **Server:** ${summary.server_name}${pathLine}
            **Commit:** \`${summary.commit_sha}\`

            Scan complete. Results are under responsible disclosure review and will not be published at this time.

            The repository maintainer will be contacted directly.

            ---
            _Credence Pipeline v${summary.pipeline_version} · ${summary.scan_timestamp}_`;

            } else {
              // ── PUBLISHABLE (VERIFIED or CONDITIONAL) ──
              let flagSection = 'No provenance flags';
              if (flags.length > 0) {
                flagSection = flags.map(f => `\`${f}\``).join(', ');
              }

              let riskLevel;
              if (verdict.includes('CONDITIONAL')) {
                riskLevel = 'CONDITIONAL';
              } else if (verdict.includes('VERIFIED')) {
                riskLevel = 'VERIFIED';
              } else {
                riskLevel = verdict;
              }

              const verifyNote = verified
                ? 'Verified maintainer submission'
                : 'Third-party submission';

              body = `## Credence Scan Results

            ${verifyNote}

            **Server:** ${summary.server_name}${pathLine}
            **Commit:** \`${summary.commit_sha}\`
            **Source hash:** \`${summary.source_hash}\`

            ### Trust Score: ${trustScore}/100 — ${riskLevel}

            | Dimension | Score |
            |-----------|-------|
            | Security | ${dims.security ?? '?'}/100 |
            | Provenance | ${dims.provenance ?? '?'}/100 |
            | Behavioral | ${dims.behavioral ?? '?'}/100 |
            | **Aggregate** | **${trustScore ?? '?'}/100** |

            Provenance flags: ${flagSection}

            Attestation signed and published to registry.

            ---
            _Credence Pipeline v${summary.pipeline_version} · Scoring v${summary.scoring_version || '?'} · ${summary.scan_timestamp}_`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            // Labels
            const verifyLabel = verified ? 'verified-maintainer' : 'third-party';
            const labels = [verifyLabel, 'scan-complete'];
            if (!publish) {
              labels.push('disclosure-pending');
            } else {
              const riskLabel = verdict.includes('CONDITIONAL') ? 'risk-medium' : 'risk-low';
              labels.push(riskLabel);
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

  # ── JOB 3: MANUAL PUBLISH ────────────────────────
  publish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install credence
        run: |
          pip install cryptography --break-system-packages -q
          pip install ./mcp-server --break-system-packages -q

      - name: Locate scan summary
        id: locate
        run: |
          SCAN_ID="${{ github.event.inputs.scan_id }}"
          SUMMARY_PATH="scan-results/${SCAN_ID}/summary.json"
          if [ ! -f "$SUMMARY_PATH" ]; then
            echo "Error: No scan results found at ${SUMMARY_PATH}"
            echo "Available scan IDs:"
            ls scan-results/ 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "summary_path=$SUMMARY_PATH" >> $GITHUB_OUTPUT
          echo "Found: $SUMMARY_PATH"

      - name: Update registry
        env:
          CREDENCE_SIGNING_KEY: ${{ secrets.CREDENCE_SIGNING_KEY }}
        run: |
          SUMMARY_PATH="${{ steps.locate.outputs.summary_path }}"
          if [ -n "$CREDENCE_SIGNING_KEY" ]; then
            python3 -m credence_mcp.registry_update "$SUMMARY_PATH" registry/ --key-env CREDENCE_SIGNING_KEY
          else
            python3 -m credence_mcp.registry_update "$SUMMARY_PATH" registry/
          fi

      - name: Commit and push
        run: |
          git config user.name "credence-bot"
          git config user.email "credence-bot@users.noreply.github.com"
          git add registry/ registry.json
          SERVER_NAME=$(jq -r '.server_name' "${{ steps.locate.outputs.summary_path }}")
          git commit -m "publish: ${SERVER_NAME} (manual disclosure clearance)"
          git push

      - name: Summary
        run: |
          SUMMARY_PATH="${{ steps.locate.outputs.summary_path }}"
          SERVER=$(jq -r '.server_name' "$SUMMARY_PATH")
          SCORE=$(jq -r '.trust_score' "$SUMMARY_PATH")
          VERDICT=$(jq -r '.thinktank_verdict' "$SUMMARY_PATH")
          echo "## Published: ${SERVER}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Score: ${SCORE}/100" >> $GITHUB_STEP_SUMMARY
          echo "- Verdict: ${VERDICT}" >> $GITHUB_STEP_SUMMARY
          echo "- Scan ID: ${{ github.event.inputs.scan_id }}" >> $GITHUB_STEP_SUMMARY
