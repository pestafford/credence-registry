<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credence - Agentic Trust Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111111;
      color: #F5F5F5;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #D4703A;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 10px;
      color: #606060;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 32px;
    }

    .qr-container {
      background: #F5F5F5;
      border-radius: 12px;
      padding: 20px;
      display: inline-block;
      margin-bottom: 24px;
    }

    .qr-container img {
      width: 200px;
      height: 200px;
      display: block;
      image-rendering: pixelated;
    }

    .url {
      font-size: 11px;
      color: #B0B0B0;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .url a {
      color: #B0B0B0;
      text-decoration: none;
      transition: color 0.2s;
    }

    .url a:hover {
      color: #D4703A;
    }

    .description {
      font-size: 12px;
      color: #606060;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #383838;
      margin: 0 auto 24px;
    }

    .org {
      font-size: 10px;
      color: #606060;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .org a {
      color: #606060;
      text-decoration: none;
      transition: color 0.2s;
    }

    .org a:hover {
      color: #D4703A;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CREDENCE</div>
    <div class="tagline">Agentic Trust Verification</div>

    <div class="qr-container">
      <img src="/card/qr.png" alt="QR code — credence.securingthesingularity.com/demo" />
    </div>

    <div class="url">
      <a href="https://credence.securingthesingularity.com/demo">credence.securingthesingularity.com/demo</a>
    </div>

    <p class="description">
      Multi-agent trust verification for MCP servers, A2A agents, OpenClaw skills, and agentic integrations.
    </p>

    <div class="divider"></div>

    <div class="org">
      <a href="https://securingthesingularity.com">Securing the Singularity</a>
    </div>
  </div>
</body>
</html>
