[project]
name = "credence-mcp"
version = "0.2.0"
description = "Install-time trust verification for MCP servers. Cryptographic attestation registry with CLI and MCP server interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Phil Stafford", email = "pe.stafford@gmail.com" }
]
keywords = ["mcp", "security", "attestation", "supply-chain", "trust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
credence = "credence_cli:main"
credence-keygen = "keygen:main"
credence-analyze = "mcp_tool_analyzer:main"
credence-normalize = "report_normalizer:main"
credence-report = "report_generator:main"
credence-badge = "badge_generator:main"
credence-thinktank = "thinktank_adapter:main"
credence-score = "trust_score:main"
credence-registry-update = "registry_update:main"

[project.urls]
Homepage = "https://pestafford.github.io/credence-registry/"
Repository = "https://github.com/pestafford/credence-registry"
Documentation = "https://securingthesingularity.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
