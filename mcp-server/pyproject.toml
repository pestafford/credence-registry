[project]
name = "credence-mcp"
version = "0.3.1"
description = "Install-time trust verification for MCP servers. Cryptographic attestation registry with CLI and MCP server interface."
readme = {text = "Credence MCP — Install-time trust verification for MCP servers.", content-type = "text/plain"}
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Phil Stafford", email = "phil@securingthesingularity.com" }
]
keywords = ["mcp", "security", "attestation", "supply-chain", "trust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
credence = "credence_mcp.cli:main"

[project.urls]
Homepage = "https://credence.securingthesingularity.com"
Repository = "https://github.com/pestafford/credence-registry"
Documentation = "https://credence.securingthesingularity.com/install.html"

[tool.hatch.build.targets.wheel]
packages = ["credence_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
