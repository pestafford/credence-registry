<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry — Credence</title>
    <meta name="description" content="Browse published Credence attestations for MCP servers. Trust scores, security verdicts, and provenance data.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #B8522A;
            --orange-light: #C96235;
            --orange-dim: #8E3F1F;
            --gray-100: #F5F5F5;
            --gray-200: #E0E0E0;
            --gray-300: #B0B0B0;
            --gray-400: #808080;
            --gray-500: #606060;
            --gray-600: #505050;
            --gray-700: #383838;
            --gray-800: #252525;
            --gray-900: #1A1A1A;
            --black: #111111;
        }

        [data-theme="dark"] {
            --bg-primary: var(--black);
            --bg-secondary: var(--gray-900);
            --bg-card: var(--gray-800);
            --bg-card-hover: var(--gray-700);
            --text-primary: var(--gray-100);
            --text-secondary: var(--gray-300);
            --text-muted: var(--gray-400);
            --border-color: var(--gray-700);
            --border-subtle: var(--gray-800);
            --code-bg: var(--gray-900);
            --glow: rgba(184, 82, 42, 0.15);
        }

        [data-theme="light"] {
            --bg-primary: #F7F6F4;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F0EEEB;
            --text-primary: var(--gray-900);
            --text-secondary: var(--gray-600);
            --text-muted: var(--gray-500);
            --border-color: #D8D4CE;
            --border-subtle: #EBE8E4;
            --code-bg: #EDEAE6;
            --glow: rgba(184, 82, 42, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* NAV */
        nav {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo {
            width: 36px;
            height: 36px;
        }
        .nav-title {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-link {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--orange); }
        .nav-link.active { color: var(--orange); }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1rem;
            transition: border-color 0.2s, color 0.2s;
        }
        .theme-toggle:hover {
            border-color: var(--orange);
            color: var(--orange);
        }

        /* PAGE HEADER */
        .page-header {
            padding: 48px 0 32px;
        }
        .page-header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .stat-card {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-card);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .stat-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--orange);
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* SERVER CARD */
        .server-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .server-card:hover {
            border-color: var(--orange-dim);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            cursor: pointer;
            user-select: none;
        }
        .card-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }
        .card-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .server-name {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .server-name a {
            color: var(--text-primary);
            text-decoration: none;
        }
        .server-name a:hover { color: var(--orange); }
        .server-id-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .server-id-label:hover {
            color: var(--orange);
        }
        .server-id-label .copy-hint {
            font-size: 0.6rem;
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: 4px;
        }
        .server-id-label:hover .copy-hint {
            opacity: 1;
        }
        .score-badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 4px;
            min-width: 42px;
            text-align: center;
        }
        .score-badge.green {
            background: rgba(107, 158, 79, 0.15);
            color: #6B9E4F;
            border: 1px solid rgba(107, 158, 79, 0.3);
        }
        .score-badge.orange {
            background: rgba(208, 96, 48, 0.15);
            color: var(--orange);
            border: 1px solid rgba(208, 96, 48, 0.3);
        }
        .score-badge.red {
            background: rgba(192, 57, 43, 0.15);
            color: #C0392B;
            border: 1px solid rgba(192, 57, 43, 0.3);
        }
        .verdict-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .expand-icon {
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .server-card.open .expand-icon {
            transform: rotate(180deg);
        }

        /* CARD BODY (expanded) */
        .card-body {
            display: none;
            padding: 0 24px 24px;
            border-top: 1px solid var(--border-subtle);
        }
        .server-card.open .card-body {
            display: block;
        }

        /* DIMENSION BARS */
        .dimensions {
            margin-top: 20px;
        }
        .dimensions h4 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .dim-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .dim-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            width: 90px;
            flex-shrink: 0;
        }
        .dim-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }
        .dim-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .dim-bar-fill.green { background: #6B9E4F; }
        .dim-bar-fill.orange { background: var(--orange); }
        .dim-bar-fill.red { background: #C0392B; }
        .dim-score {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            width: 28px;
            text-align: right;
            flex-shrink: 0;
        }

        /* DETAIL GRID */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .detail-section h4 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-size: 0.8rem;
        }
        .detail-key {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .detail-val {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .detail-val.zero { color: #6B9E4F; }
        .detail-val.nonzero { color: var(--orange); }

        /* ATTESTATION FOOTER */
        .card-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .footer-item {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .footer-item a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        .footer-item a:hover { color: var(--orange); }
        .signed-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: #6B9E4F;
            border: 1px solid rgba(107, 158, 79, 0.3);
            padding: 2px 8px;
            border-radius: 3px;
            background: rgba(107, 158, 79, 0.08);
        }
        .unsigned-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 3px;
        }

        .threat-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .threat-tag.adversarial {
            background: rgba(192, 57, 43, 0.15);
            color: #C0392B;
            border: 1px solid rgba(192, 57, 43, 0.3);
        }
        .threat-tag.vulnerability {
            background: rgba(208, 96, 48, 0.15);
            color: var(--orange);
            border: 1px solid rgba(208, 96, 48, 0.3);
        }

        /* Owner scope + verified badge */
        .server-owner {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .verified-maintainer {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            color: #6B9E4F;
            border: 1px solid rgba(107, 158, 79, 0.3);
            padding: 1px 6px;
            border-radius: 3px;
            background: rgba(107, 158, 79, 0.08);
            margin-left: 6px;
            vertical-align: middle;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-muted);
        }
        .empty-state p {
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .empty-state a {
            color: var(--orange);
            text-decoration: none;
        }
        .empty-state a:hover { text-decoration: underline; }

        /* FOOTER */
        footer {
            padding: 32px 0;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            margin-top: 40px;
        }
        footer p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        footer a:hover { color: var(--orange); }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .page-header h1 { font-size: 1.4rem; }
            .card-header { padding: 16px; flex-wrap: wrap; gap: 10px; }
            .card-body { padding: 0 16px 16px; }
            .detail-grid { grid-template-columns: 1fr; }
            .card-footer { flex-direction: column; align-items: flex-start; }
            .nav-right { gap: 8px; }
            .nav-link { font-size: 0.7rem; }
            .nav-title { display: none; }
            .stats-bar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<nav>
    <div class="container">
        <div class="nav-left">
            <a href="index.html"><img src="credencelogo.png" alt="Credence" class="nav-logo"></a>

        </div>
        <div class="nav-right">

</nav>

<div class="container">
    <div class="page-header">
        <h1>Registry</h1>
        <p>Published attestations for MCP servers scanned by the Credence pipeline.</p>
    </div>

    <div id="stats-bar" class="stats-bar" style="display:none;"></div>
    <div id="server-list"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
        <p>No servers published yet.</p>
        <a href="index.html#submit">Submit an MCP server for analysis</a>
    </div>
</div>

<footer>
    <div class="container">
        <p>&copy; 2026 Phil Stafford &middot; MIT License &middot; <a href="https://github.com/pestafford/credence-registry">GitHub</a></p>
    </div>
</footer>

<script>
    function toggleTheme() {
        var html = document.documentElement;
        var current = html.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('credence-theme', next);
    }

    var saved = localStorage.getItem('credence-theme');
    if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
    }

    function timeAgo(dateStr) {
        var now = Date.now();
        var then = new Date(dateStr).getTime();
        var seconds = Math.floor((now - then) / 1000);
        if (seconds < 60) return 'just now';
        var minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm ago';
        var hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + 'h ago';
        var days = Math.floor(hours / 24);
        if (days < 30) return days + 'd ago';
        var months = Math.floor(days / 30);
        return months + 'mo ago';
    }

    function scoreBadgeClass(score) {
        if (score >= 90) return 'green';
        if (score >= 70) return 'orange';
        return 'red';
    }

    function dimBarClass(score) {
        if (score >= 90) return 'green';
        if (score >= 70) return 'orange';
        return 'red';
    }

    function verdictLabel(verdict) {
        if (!verdict) return 'PENDING';
        var v = verdict.toUpperCase();
        if (v.startsWith('VERIFIED') || v.startsWith('APPROVED')) return 'VERIFIED';
        if (v.startsWith('CONDITIONAL')) return 'CONDITIONAL';
        if (v.startsWith('REJECTED') || v.startsWith('FLAGGED')) return 'FLAGGED';
        return verdict.replace(/_/g, ' ');
    }

    function verdictColor(verdict) {
        var v = (verdict || '').toUpperCase();
        if (v.startsWith('VERIFIED') || v.startsWith('APPROVED')) return '#6B9E4F';
        if (v.startsWith('CONDITIONAL')) return 'var(--orange)';
        return '#C0392B';
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Cache for loaded server details (keyed by server_id)
    var _detailCache = {};

    // Cache index entries for fallback when attestation file is missing
    var _indexEntryCache = {};

    function copyServerId(el, event) {
        event.stopPropagation();
        var id = el.getAttribute('data-sid');
        navigator.clipboard.writeText(id).then(function() {
            var hint = el.querySelector('.copy-hint');
            if (hint) {
                hint.textContent = 'copied';
                setTimeout(function() { hint.textContent = 'copy'; }, 1500);
            }
        });
    }

    function toggleCard(el) {
        var card = el.closest('.server-card');
        var wasOpen = card.classList.contains('open');
        card.classList.toggle('open');

        // Lazy-load detail on first expand
        if (!wasOpen) {
            var serverId = card.getAttribute('data-server-id');
            var attestFile = card.getAttribute('data-attestation-file');
            var bodyEl = card.querySelector('.card-body');
            if (serverId && attestFile && !_detailCache[serverId]) {
                bodyEl.innerHTML = '<div style="padding:20px 0; color:var(--text-muted); font-size:0.8rem;">Loading details...</div>';
                fetch('registry/' + attestFile)
                    .then(function(r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function(detail) {
                        _detailCache[serverId] = detail;
                        bodyEl.innerHTML = renderCardBody(detail);
                    })
                    .catch(function() {
                        // Fall back to index entry data
                        var indexEntry = _indexEntryCache[serverId];
                        if (indexEntry) {
                            bodyEl.innerHTML = renderCardBodyFromIndex(indexEntry);
                        } else {
                            bodyEl.innerHTML = '<div style="padding:20px 0; color:var(--text-muted); font-size:0.8rem;">Could not load details.</div>';
                        }
                    });
            } else if (_detailCache[serverId]) {
                bodyEl.innerHTML = renderCardBody(_detailCache[serverId]);
            }
        }
    }

    function renderCardBody(entry) {
        var a = entry.attestation;
        var dims = a.trust_dimensions || {};
        var author = a.author_identity || {};
        var attestUrl = entry.attestation_url || '#';
        var commitShort = (a.commit_sha || '').substring(0, 12);
        var isSigned = a.signature && a.signature.value;
        var dateStr = a.attested_at ? new Date(a.attested_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
        var html = '';

        // Dimension bars
        if (dims.security !== undefined || dims.provenance !== undefined || dims.behavioral !== undefined) {
            html += '<div class="dimensions">';
            html += '<h4>Trust Dimensions</h4>';
            var dimList = [
                { label: 'Security', value: dims.security, weight: '30%' },
                { label: 'Provenance', value: dims.provenance, weight: '40%' },
                { label: 'Behavioral', value: dims.behavioral, weight: '30%' }
            ];
            dimList.forEach(function(d) {
                if (d.value === undefined) return;
                var barClass = dimBarClass(d.value);
                html += '<div class="dim-row">';
                html += '<span class="dim-label">' + d.label + ' <span style="color:var(--text-muted); font-size:0.65rem;">(' + d.weight + ')</span></span>';
                html += '<div class="dim-bar-bg"><div class="dim-bar-fill ' + barClass + '" style="width:' + d.value + '%"></div></div>';
                html += '<span class="dim-score">' + d.value + '</span>';
                html += '</div>';
            });
            html += '</div>';
        }

        // Detail grids
        html += '<div class="detail-grid">';
        html += '<div class="detail-section">';
        html += '<h4>Attestation</h4>';
        html += '<div class="detail-row"><span class="detail-key">Pipeline</span><span class="detail-val">v' + escapeHtml(a.pipeline_version || '?') + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Scoring</span><span class="detail-val">v' + escapeHtml(a.scoring_version || '?') + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Signed</span><span class="detail-val ' + (isSigned ? 'zero' : 'nonzero') + '">' + (isSigned ? 'yes' : 'no') + '</span></div>';
        if (a.threat_type) {
            html += '<div class="detail-row"><span class="detail-key">Threat type</span><span class="detail-val nonzero">' + escapeHtml(a.threat_type) + '</span></div>';
        }
        html += '</div>';

        html += '<div class="detail-section">';
        html += '<h4>Provenance</h4>';
        html += '<div class="detail-row"><span class="detail-key">Owner</span><span class="detail-val">' + escapeHtml(author.repo_owner || '\u2014') + '</span></div>';
        var mvLabel = author.maintainer_verified ? 'verified' : 'third-party';
        html += '<div class="detail-row"><span class="detail-key">Submitter</span><span class="detail-val ' + (author.maintainer_verified ? 'zero' : 'nonzero') + '">' + mvLabel + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Identity match</span><span class="detail-val ' + (author.identity_match ? 'zero' : 'nonzero') + '">' + (author.identity_match ? 'yes' : 'no') + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Fork</span><span class="detail-val ' + (author.is_fork ? 'nonzero' : 'zero') + '">' + (author.is_fork ? 'yes' : 'no') + '</span></div>';
        var flags = author.provenance_flags || [];
        html += '<div class="detail-row"><span class="detail-key">Flags</span><span class="detail-val ' + (flags.length > 0 ? 'nonzero' : 'zero') + '">' + (flags.length > 0 ? escapeHtml(flags.join(', ')) : 'none') + '</span></div>';
        var lockfileName = a.lockfile_name || 'none';
        html += '<div class="detail-row"><span class="detail-key">Lockfile</span><span class="detail-val">' + escapeHtml(lockfileName) + '</span></div>';
        html += '</div>';
        html += '</div>';

        // Footer
        html += '<div class="card-footer">';
        html += '<div class="card-footer-left">';
        if (commitShort) {
            html += '<span class="footer-item"><a href="' + escapeHtml(attestUrl) + '" target="_blank" rel="noopener">' + commitShort + '</a></span>';
        }
        if (dateStr) {
            html += '<span class="footer-item">' + dateStr + '</span>';
        }
        if (a.scoring_version) {
            html += '<span class="footer-item">v' + escapeHtml(a.scoring_version) + '</span>';
        }
        html += '</div>';
        if (isSigned) {
            html += '<span class="signed-badge">ed25519 signed</span>';
        } else {
            html += '<span class="unsigned-badge">unsigned</span>';
        }
        html += '</div>';

        return html;
    }

    function renderCardBodyFromIndex(entry) {
        var score = entry.trust_score || 0;
        var verdict = entry.thinktank_verdict || 'PENDING';
        var dateStr = entry.attested_at ? new Date(entry.attested_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
        var html = '';

        html += '<div class="detail-grid">';
        html += '<div class="detail-section">';
        html += '<h4>Attestation</h4>';
        html += '<div class="detail-row"><span class="detail-key">Score</span><span class="detail-val">' + score + '/100</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Verdict</span><span class="detail-val">' + escapeHtml(verdict) + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Scoring</span><span class="detail-val">v' + escapeHtml(entry.scoring_version || '?') + '</span></div>';
        if (entry.threat_type) {
            html += '<div class="detail-row"><span class="detail-key">Threat type</span><span class="detail-val nonzero">' + escapeHtml(entry.threat_type) + '</span></div>';
        }
        html += '</div>';

        html += '<div class="detail-section">';
        html += '<h4>Provenance</h4>';
        html += '<div class="detail-row"><span class="detail-key">Owner</span><span class="detail-val">' + escapeHtml(entry.repo_owner || '\u2014') + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Repository</span><span class="detail-val"><a href="' + escapeHtml(entry.repo_url || '#') + '" target="_blank" rel="noopener" style="color:var(--text-secondary);text-decoration:none;">' + escapeHtml(entry.repo_url || '\u2014') + '</a></span></div>';
        html += '</div>';
        html += '</div>';

        // Footer
        html += '<div class="card-footer">';
        html += '<div class="card-footer-left">';
        if (dateStr) {
            html += '<span class="footer-item">' + dateStr + '</span>';
        }
        html += '</div>';
        html += '<span style="font-family:\'IBM Plex Mono\',monospace; font-size:0.7rem; color:var(--text-muted);">Expand to full detail from attestation file unavailable</span>';
        html += '</div>';

        return html;
    }

    function renderServers(servers) {
        var listEl = document.getElementById('server-list');

        if (servers.length === 0) {
            document.getElementById('empty-state').style.display = 'block';
            return;
        }

        // Stats bar
        var avgScore = Math.round(servers.reduce(function(s, e) {
            return s + (e.trust_score || 0);
        }, 0) / servers.length);
        var latestDate = servers[0].attested_at;

        var statsEl = document.getElementById('stats-bar');
        var totalScanned = (window._registryStats && window._registryStats.total_scans) || servers.length;
        statsEl.innerHTML =
            '<div class="stat-card"><div class="stat-value">' + totalScanned + '</div><div class="stat-label">Servers scanned</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + servers.length + '</div><div class="stat-label">Published</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + avgScore + '</div><div class="stat-label">Average trust score</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + timeAgo(latestDate) + '</div><div class="stat-label">Latest scan</div></div>';
        statsEl.style.display = 'flex';

        // Server cards (rendered from index — no detail needed for collapsed view)
        var html = '';

        servers.forEach(function(entry) {
            _indexEntryCache[entry.server_id] = entry;
            var score = entry.trust_score || 0;
            var owner = entry.repo_owner || '';
            var rawName = entry.canonical_name || entry.server_name || entry.server_id.split('/').pop();
            var displayName = rawName;
            if (owner && rawName.indexOf('@') === 0) {
                var scopeMatch = rawName.match(/^@([^/]+)\/(.*)/);
                if (scopeMatch && scopeMatch[1].toLowerCase() === owner.toLowerCase()) {
                    displayName = scopeMatch[2];
                }
            }
            var repoUrl = entry.repo_url || ('https://github.com/' + entry.server_id);
            var badgeClass = scoreBadgeClass(score);
            var vLabel = verdictLabel(entry.thinktank_verdict);
            var vColor = verdictColor(entry.thinktank_verdict);

            html += '<div class="server-card" data-server-id="' + escapeHtml(entry.server_id) + '" data-attestation-file="' + escapeHtml(entry.attestation_file) + '">';
            html += '<div class="card-header" onclick="toggleCard(this)">';
            html += '<div class="card-header-left">';
            html += '<div>';
            if (owner) {
                html += '<div class="server-owner">' + escapeHtml(owner) + '</div>';
            }
            html += '<div class="server-name"><a href="' + escapeHtml(repoUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(displayName) + '</a></div>';
            html += '<div class="server-id-label" data-sid="' + escapeHtml(entry.server_id) + '" onclick="copyServerId(this, event)">' + escapeHtml(entry.server_id) + '<span class="copy-hint">copy</span></div>';
            html += '</div>';
            html += '</div>';
            html += '<div class="card-header-right">';
            if (entry.threat_type) {
                html += '<span class="threat-tag ' + escapeHtml(entry.threat_type) + '">' + escapeHtml(entry.threat_type) + '</span>';
            }
            html += '<span class="verdict-label" style="color:' + vColor + '">' + vLabel + '</span>';
            html += '<span class="score-badge ' + badgeClass + '">' + score + '</span>';
            html += '<span class="expand-icon">&#9660;</span>';
            html += '</div>';
            html += '</div>';

            html += '<div class="card-body"></div>';
            html += '</div>';
        });

        listEl.innerHTML = html;
    }

    // Load index
    fetch('registry/index.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var servers = (data.servers || []).filter(function(s) {
                return s.scoring_version;
            });

            servers.sort(function(a, b) {
                return new Date(b.attested_at) - new Date(a.attested_at);
            });

            window._registryStats = data.stats || {};
            renderServers(servers);
        })
        .catch(function() {
            document.getElementById('empty-state').style.display = 'block';
        });
</script>

</body>
</html>
